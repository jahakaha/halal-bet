[env]
_.file = [".env"]

[tools]
go = "1.26.0"

[tasks.dev]
description = "Run dev server with hot reload"
run = "go tool air"

[tasks.test]
description = "Run all tests (unit + integration)"
run = "TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/foot_test?sslmode=disable go test ./... -count=1"

[tasks."test:integration"]
description = "Run integration tests (requires running Postgres)"
run = "TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/foot_test?sslmode=disable go test ./internal/repository/... -v -count=1"

[tasks.lint]
description = "Run linter"
run = "go tool staticcheck ./..."

[tasks."accessories:up"]
description = "Run docker accessories"
run = 'docker compose --profile accessories up -d'

[tasks."accessories:down"]
description = "Shutdown docker accessories"
run = 'docker compose --profile accessories stop'

[tasks."accessories:remove"]
description = "Shutdown docker accessories"
run = 'docker compose --profile accessories down -v'

[tasks."db:create"]
description = "Create dev and test databases"
run = [
    "PGPASSWORD=postgres createdb -E UTF8 -h localhost -U postgres foot_dev",
    "PGPASSWORD=postgres createdb -E UTF8 -h localhost -U postgres foot_test"
]


[tasks."db:drop"]
description = "Drop dev and test databases"
run = [
    "dropdb -h localhost -U postgres --if-exists foot_dev",
    "dropdb -h localhost -U postgres --if-exists foot_test"
]

[tasks."db:reset"]
description = "Reset dev and test databases"
run = [
    "mise db:drop",
    "mise db:create"
]

[tasks."db:migrate"]
description = "Apply migrations to dev DB"
run = "go tool goose -dir ./db/migrations up"

[tasks."db:migrate:test"]
description = "Apply migrations to test DB"
run = "GOOSE_DBSTRING=postgres://postgres:postgres@localhost:5432/foot_test?sslmode=disable go tool goose -dir ./db/migrations up"

[tasks."db:rollback"]
description = "Rollback last migration"
run = "go tool goose -dir ./db/migrations down"

[tasks."db:status"]
description = "Check migration status"
run = "go tool goose -dir ./db/migrations status"

[tasks."db:migration"]
description = "Create migration"
usage = 'arg "name"'
run = 'go tool goose -dir ./db/migrations create "${usage_name}" sql'

[tasks."dwh:rollback"]
description = "Rollback last DWH migration"